# Build do site (Astro) e publicação no GitHub Pages a cada push na main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@10
        env:
          # Site de projeto: https://<org>.github.io/<repo>/
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://akcit-pixel.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
